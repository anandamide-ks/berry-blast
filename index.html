<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Berry Blast, a private cycle tracker. Your entries stay on this device. anandamide.ks">
<meta name="theme-color" content="#F4F1F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A121F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Berry Blast">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="author" content="anandamide.ks">
<title>Berry Blast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a phone-first column of separate pages with a bottom tab bar.
   Same berry, teal and saffron palette, newspaper type and the two cat supervisors. anandamide.ks */
:root{
  --paper:#F4F1F7; --card:#FFFFFF; --ink:#2B1A36; --muted:#6E6078; --line:#E2DCE8;
  --period:#C4284F; --on-period:#FFFFFF; --fertile:#1E8C83; --ovu:#C98612; --heart:#1F5FD1; --heart-on-period:#CFE4FF;
  --display:"Source Serif 4", "Georgia", "Times New Roman", serif;
  --body:"Libre Franklin", "Franklin Gothic Medium", "Helvetica Neue", Arial, sans-serif;
  --mast:"UnifrakturCook", "Old English Text MT", "Source Serif 4", Georgia, serif;
  --hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --tabh:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1A121F; --card:#241A2B; --ink:#F1EAF5; --muted:#A99BB3; --line:#3A2D43;
    --period:#EC5C7E; --on-period:#1A121F; --fertile:#4CC2B7; --ovu:#EDB44A; --heart:#7FB2FF; --heart-on-period:#0F3A99;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1A121F; --card:#241A2B; --ink:#F1EAF5; --muted:#A99BB3; --line:#3A2D43;
  --period:#EC5C7E; --on-period:#1A121F; --fertile:#4CC2B7; --ovu:#EDB44A; --heart:#7FB2FF; --heart-on-period:#0F3A99;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--paper);background-image:
  radial-gradient(circle at 24px 30px,color-mix(in srgb,var(--ovu) 60%,transparent) 1.3px,transparent 1.8px),
  radial-gradient(circle at 104px 118px,color-mix(in srgb,var(--period) 45%,transparent) 1.1px,transparent 1.6px),
  radial-gradient(circle at 156px 62px,color-mix(in srgb,var(--fertile) 50%,transparent) 1.3px,transparent 1.8px);
  background-size:190px 170px;background-color:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1:focus{outline:none}

/* page frame */
.view{max-width:600px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(var(--tabh) + 36px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
.view.bare{padding-bottom:calc(36px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px}
.mark{font-family:var(--mast);font-weight:700;font-size:27px;line-height:1.1;display:flex;align-items:center;gap:8px;text-decoration:underline wavy var(--period);text-decoration-thickness:1.5px;text-underline-offset:7px;color:var(--ink)}
.mark svg{width:20px;height:20px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0}
.iconbtn svg{width:20px;height:20px}
.iconbtn:hover{border-color:var(--ink)}
.back{background:none;border:0;padding:6px 0;font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;align-self:flex-start}
.back:hover{color:var(--ink)}
.head{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1.title{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.1;letter-spacing:-.015em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:0;max-width:60ch}
h2{font-family:var(--body);font-size:15px;font-weight:700;margin:6px 0 -6px;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.card.soft{background:color-mix(in srgb,var(--ink) 4%,var(--card))}
.stack{display:flex;flex-direction:column;gap:14px}
.hr{height:1px;background:var(--line);margin:4px 0}
.small{font-size:13px;color:var(--muted)}
.fine{font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.k{font-size:13px;color:var(--muted)}
.big2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15}
.hand{font-family:var(--hand);font-size:21px;line-height:1.2;color:var(--muted)}

/* buttons and inputs */
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--period);border-color:var(--period);color:var(--on-period)}
.btn.danger{border-color:var(--period);color:var(--period);background:transparent}
.btn.block{width:100%;padding:14px 18px;border-radius:14px;font-size:16px}
.btn.text{border:0;background:none;color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--period);font-weight:600;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.arrowlink{background:none;border:0;padding:0;color:var(--ink);font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center;align-self:flex-start}
.arrowlink:hover{color:var(--period)}
label.btn{cursor:pointer;display:inline-block}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--ink)}
.field .opt{font-weight:400;color:var(--muted)}
.field input{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);min-width:0;width:100%;font-weight:400}
.inline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.inline input{width:96px}
.fields{display:flex;flex-direction:column;gap:16px}
textarea{width:100%;min-height:90px;resize:vertical;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-size:14px;color:var(--ink)}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.seg.flow .chip[aria-pressed="true"]{background:var(--period);border-color:var(--period);color:var(--on-period)}
.seg.sex .chip[aria-pressed="true"]{background:var(--heart);border-color:var(--heart);color:#fff}
.lbl{font-size:15px;font-weight:700;margin:0 0 10px}
.lbl .opt{font-weight:400;color:var(--muted)}
details.more summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "}
details.more[open] summary::before{content:"– "}
details.more .inner{display:flex;flex-direction:column;gap:18px;margin-top:16px}
.tog{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.tog input,.catopt input{width:20px;height:20px;accent-color:var(--period);flex:none}

/* setup */
.progress{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);border-radius:2px}
.footnote{text-align:center;font-size:12px;color:var(--muted)}

/* dial */
.dial{position:relative;width:100%;max-width:240px;margin:0 auto}
.dial svg{display:block;width:100%;height:auto}
.dial .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 44px}
.dial .big{font-family:var(--display);font-weight:700;font-size:52px;line-height:1}
.dial .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dial .phase{font-size:14px;font-weight:600;margin-top:4px}
.tw{transform-box:fill-box;transform-origin:center}

/* cats */
.cats{display:flex;align-items:flex-end;gap:6px}
.catbtn{background:none;border:0;padding:0;width:84px;flex:none;border-radius:16px}
.catbtn.small{width:78px}
.catbtn svg{display:block;width:100%;height:auto;overflow:visible}
.bubble{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:18px 18px 18px 4px;padding:8px 14px 9px;margin-bottom:20px;font-family:var(--hand);font-size:22px;line-height:1.15;color:var(--period);flex:1;min-width:0}
.bubble small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.tail{transform-box:fill-box;transform-origin:10% 90%}
.blink{transform-box:fill-box;transform-origin:center}

/* roaming stage on sign-in */
.stage{position:relative;height:232px;border-radius:18px;background:
  linear-gradient(to top,color-mix(in srgb,var(--ovu) 16%,var(--card)) 0 26px,transparent 26px),var(--card);border:1px solid var(--line);overflow:hidden}
.roamer{position:absolute;bottom:8px;left:0;width:124px;display:flex;flex-direction:column;align-items:center}
.roamer .catbtn{width:112px}
.roamer .say{font-family:var(--hand);font-size:19px;line-height:1.1;color:var(--period);background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:4px 10px;white-space:nowrap;margin-bottom:4px;position:relative}
.roamer .say::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--line);border-bottom:0}
.r1{left:4%} .r2{left:calc(100% - 132px)}
.roamer .say{white-space:normal;max-width:140px;text-align:center}
.r2 .say{margin-bottom:58px}
.r2{z-index:1}

/* today */
.cyclecard{display:flex;flex-direction:column;gap:12px}
.glance{display:flex;flex-direction:column}
.glance .gr{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.glance .gr:last-child{border-bottom:0}
.glance .gr span:last-child{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.checkhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchips span{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:13px}
.pchips span.f{background:var(--period);border-color:var(--period);color:var(--on-period)}
.pchips span.x{border-color:var(--heart);color:var(--heart)}
.ctx{display:flex;gap:8px;flex-wrap:wrap}
.ctx .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* calendar */
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.calhead .m{font-family:var(--display);font-weight:700;font-size:22px}
.nav{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;font-size:18px;line-height:1}
.nav:hover{border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.d{position:relative;aspect-ratio:1;min-height:38px;border:1.5px solid transparent;border-radius:10px;background:transparent;font-variant-numeric:tabular-nums;font-weight:500;padding:0}
.d:hover{border-color:var(--muted)}
.d.out{color:var(--muted);opacity:.5}
.d.fert{background:color-mix(in srgb,var(--fertile) 18%,var(--card))}
.d.ovu{box-shadow:inset 0 0 0 2.5px var(--ovu)}
.d.pred{border:1.5px dashed var(--period)}
.d.f1::after{content:"";position:absolute;left:50%;bottom:5px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--period)}
.d.f2{background:color-mix(in srgb,var(--period) 30%,var(--card))}
.d.f3{background:color-mix(in srgb,var(--period) 72%,var(--card));color:var(--on-period)}
.d.f4{background:var(--period);color:var(--on-period)}
.d.today{font-weight:700;border-radius:58% 42% 55% 45% / 46% 56% 44% 54%;outline:2px solid var(--ink);outline-offset:-4px}
.d.sel{border:2px solid var(--ink)}
.d.note::before{content:"";position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}
.sx{position:absolute;left:4px;top:2px;font-size:10px;font-style:normal;line-height:1.2;color:var(--heart)}
.d.f3 .sx,.d.f4 .sx{color:var(--heart-on-period)}
.sxl{font-style:normal;font-size:12px;color:var(--heart)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
.sw.p{background:var(--period)} .sw.pr{border:1.5px dashed var(--period)}
.sw.f{background:color-mix(in srgb,var(--fertile) 30%,var(--card))} .sw.o{box-shadow:inset 0 0 0 2.5px var(--ovu)}
.selday{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.plus{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1;flex:none}
.plus:hover{border-color:var(--ink)}

/* insights */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:color-mix(in srgb,var(--ink) 4%,var(--card));border:1px solid var(--line);border-radius:16px;padding:16px}
.tile .n{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.list .li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.list .li:last-child{border-bottom:0}
.list .li .r{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.bar{height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden;flex:1;max-width:120px}
.bar b{position:absolute;left:0;top:0;bottom:0;background:var(--period);border-radius:4px}

/* settings */
.rows{display:flex;flex-direction:column;padding:4px 18px}
.rowlink{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;color:var(--ink)}
.rowlink:last-child{border-bottom:0}
.rowlink b{display:block;font-size:15px}
.rowlink small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.rowlink .chev{color:var(--muted);font-size:18px;flex:none}
.rowlink.danger b{color:var(--period)}
.rowlink:hover .chev{color:var(--ink)}
.rowlink input[type=checkbox]{width:22px;height:22px;accent-color:var(--period);flex:none}
.editbox{display:flex;gap:14px;flex-wrap:wrap;padding:0 0 14px;border-bottom:1px solid var(--line)}
.editbox .field input{width:110px}

/* sharing */
.catopts{display:grid;gap:10px}
.catopt{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.catopt span{display:flex;flex-direction:column}
.catopt small{color:var(--muted);font-size:13px}
.code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:28px;font-weight:700;letter-spacing:.14em;color:var(--ink)}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-bottom:1px dashed var(--line)}
.prow:last-child{border-bottom:0}
.prow .who{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.pmsg{font-size:14px;min-height:1.2em}
.pmsg.err{color:var(--period);font-weight:600}
.err{color:var(--period)}

/* tab bar, menu, toast */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:6px calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}
.tabbar .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabbar button{border:0;background:none;border-radius:12px;padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{background:color-mix(in srgb,var(--period) 12%,var(--card));color:var(--ink);font-weight:700}
.tabbar button[aria-current="page"] svg{color:var(--period)}
.scrim{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 35%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.sheet .rowlink{padding:15px 4px}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.18)}

/* effects */
.fx{position:fixed;left:0;top:0;pointer-events:none;z-index:40;font-size:15px;line-height:1;animation:fly .75s ease-out forwards}
@keyframes fly{from{transform:translate(var(--x),var(--y)) scale(.6);opacity:1}to{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) scale(1.25) rotate(var(--r));opacity:0}}
@keyframes swish{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pop{0%{transform:scale(.88)}60%{transform:scale(1.08) rotate(-2deg)}100%{transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}40%{transform:scale(1.5)}}
@keyframes roamA{0%{left:2%}45%{left:calc(100% - 128px)}50%{left:calc(100% - 128px)}95%{left:2%}100%{left:2%}}
@keyframes roamB{0%{left:calc(100% - 128px)}40%{left:4%}50%{left:4%}90%{left:calc(100% - 128px)}100%{left:calc(100% - 128px)}}
@keyframes waddle{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-4px)}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

@media (prefers-reduced-motion:no-preference){
  .d,.chip,.btn,.nav,.iconbtn,.plus{transition:border-color .12s, background-color .12s, transform .15s}
  .d:hover{transform:rotate(-5deg) scale(1.1)}
  .chip:hover,.btn:hover{transform:translateY(-1px) rotate(-1.5deg)}
  .btn.block:hover{transform:translateY(-1px)}
  .nav:hover,.plus:hover{transform:scale(1.1)}
  .catbtn{transition:transform .15s}
  .catbtn:hover{transform:scale(1.06) rotate(-3deg)}
  .tail{animation:swish 2.6s ease-in-out infinite}
  .blink{animation:blink 5s linear infinite}
  .pop{animation:pop .28s ease-out}
  .d:hover .sx{animation:beat .5s ease-in-out}
  .sx{display:inline-block}
  .tw{animation:twinkle 3.2s ease-in-out infinite}
  .moon{animation:bob 4s ease-in-out infinite}
  .r1{animation:roamA 13s ease-in-out infinite}
  .r2{animation:roamB 16s ease-in-out infinite}
  .roamer .catbtn svg{animation:waddle .7s ease-in-out infinite}
  .r2 .catbtn svg{animation-duration:.6s}
  .toast{animation:toastin .2s ease-out}
}
@media (min-width:700px){
  h1.title{font-size:36px}
}
</style>
</head>

function topbar(){return '<div class="top"><div class="mark">'+MOON+'Berry Blast</div><button class="iconbtn" id="menu-open" type="button" aria-label="Open menu">'+ICON.menu+'</button></div>'}
function headBlock(eyebrow,title,sub){
  return '<div class="head">'+(eyebrow?'<div class="eyebrow">'+esc(eyebrow)+'</div>':'')+'<h1 class="title" tabindex="-1">'+esc(title)+'</h1>'+(sub?'<p class="sub">'+sub+'</p>':'')+'</div>';

function ctxSwitch(){
  if(!uid()||!P.withMe.length) return "";
  var h='<div class="ctx" role="group" aria-label="Whose cycle"><button class="chip" type="button" id="ctx-me" data-ctx="" aria-pressed="'+(!P.view)+'">My cycle</button>';
  P.withMe.forEach(function(w,i){h+='<button class="chip" type="button" id="ctx-'+i+'" data-ctx="'+esc(w.id)+'" aria-pressed="'+(P.view===w.id)+'">'+esc(w.name)+'</button>'});
  return h+'</div>';
}
function poss(M){return M.me?"Your":esc(M.name)+"'s"}
function arc(a,b,total,color,w){
  var r=92,C=2*Math.PI*r,len=Math.max(0,(b-a)/total*C);
  return '<circle cx="120" cy="120" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+w+'" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-a/total*C).toFixed(2)+'" transform="rotate(-90 120 120)"/>';
}
function pt(frac,r){var a=frac*2*Math.PI-Math.PI/2;return [120+r*Math.cos(a),120+r*Math.sin(a)]}
function dial(avg,pavg,cd,phase){
  var n=avg,p=Math.min(pavg,n),f0=Math.max(p,n-19),f1=Math.max(f0,n-12),ovc=n-13.5;
  var s='<svg viewBox="0 0 240 240" role="img" aria-label="'+(cd?"Cycle day "+cd+", "+esc(phase):"Typical "+n+"-day cycle")+'">'+
    '<circle cx="120" cy="120" r="92" fill="none" stroke="var(--line)" stroke-width="14"/>'+arc(0,p,n,"var(--period)",14)+arc(f0,f1,n,"var(--fertile)",14);
  if(ovc>p){var o=pt(ovc/n,92);s+='<circle cx="'+o[0].toFixed(1)+'" cy="'+o[1].toFixed(1)+'" r="6" fill="var(--ovu)" stroke="var(--card)" stroke-width="2"/>'}
  [[120,46,1,0],[60,74,.8,.9],[183,88,.7,1.7],[66,172,.7,2.3],[178,168,.9,.5]].forEach(function(q){
    s+='<g transform="translate('+q[0]+' '+q[1]+') scale('+q[2]+')"><path class="tw" style="animation-delay:'+q[3]+'s" d="M0 -6 Q0 0 6 0 Q0 0 0 6 Q0 0 -6 0 Q0 0 0 -6Z" fill="var(--ovu)"/></g>';
  });
  if(cd){var m=pt((Math.min(cd,n)-0.5)/n,92);s+='<g transform="translate('+m[0].toFixed(1)+' '+m[1].toFixed(1)+')"><g class="moon"><circle r="13" fill="var(--card)" stroke="var(--ink)" stroke-width="2.5"/><path d="M3 -7 A8 8 0 1 0 3 7 A9 9 0 0 1 3 -7Z" fill="var(--ink)"/></g></g>'}
  s+='</svg><div class="mid" aria-hidden="true">';
  if(cd) s+='<div class="lab">Cycle day</div><div class="big">'+cd+'</div><div class="phase">'+esc(phase)+'</div>';
  else s+='<div class="lab">Typical cycle</div><div class="big">'+n+'</div><div class="phase">days</div>';
  return '<div class="dial">'+s+'</div></div>';
}
function dayChips(r,cats){
  var h="";
  if(cats.period&&r.f) h+='<span class="f">'+FLOW[r.f]+' flow</span>';
  if(cats.sym&&r.s) r.s.forEach(function(x){h+='<span>'+esc(x)+'</span>'});
  if(cats.sex&&r.x) r.x.forEach(function(x){h+='<span class="x">♥ '+esc(x)+'</span>'});
  return h?'<div class="pchips">'+h+'</div>':"";
}
function dayHas(r,cats){return !!((cats.period&&r.f)||(cats.sym&&((r.s&&r.s.length)||r.n))||(cats.sex&&r.x&&r.x.length))}
function dayBits(M,n){
  var b=[];if(n===T)b.push("Today");
  var cyc=null;M.cycles.forEach(function(c){if(c.start<=n)cyc=c});
  if(cyc&&n-cyc.start<90) b.push("Cycle day "+(n-cyc.start+1)); else if(M.has&&n>=M.ls&&n-M.ls<90) b.push("Cycle day "+(n-M.ls+1));
  if(M.pred[n]) b.push("Period predicted");
  if(M.ovu[n]) b.push("Estimated ovulation"); else if(M.fert[n]) b.push("Fertile window");
  return b.join(" · ");
}
function calGrid(M,vy,vm,sel){
  var first=num(vy+"-"+pad(vm+1)+"-01"),dow=(new Date(first*DAY).getUTCDay()+6)%7,start=first-dow;
  var dim=new Date(Date.UTC(vy,vm+1,0)).getUTCDate(),weeks=Math.ceil((dow+dim)/7);
  var h='<div class="calhead"><div class="m">'+fmt(first,{month:"long",year:"numeric"})+'</div><div class="row"><button class="nav" id="cal-prev" type="button" aria-label="Previous month">‹</button><button class="nav" id="cal-next" type="button" aria-label="Next month">›</button></div></div><div class="grid">';
  ["M","T","W","T","F","S","S"].forEach(function(d){h+='<div class="dow" aria-hidden="true">'+d+'</div>'});
  for(var i=0;i<weeks*7;i++){
    var n=start+i,r=M.days[key(n)]||{},f=M.cats.period?(r.f||0):0,c="d",lab=[fmt(n,{weekday:"long",day:"numeric",month:"long"})];
    if(n<first||n>=first+dim) c+=" out";
    if(f){c+=" f"+f;lab.push(FLOW[f]+" flow")}
    else{if(M.fert[n]){c+=" fert";lab.push("fertile window")}if(M.pred[n]){c+=" pred";lab.push("predicted period")}}
    if(M.ovu[n]&&f<2){c+=" ovu";lab.push("estimated ovulation")}
    if(M.cats.sym&&((r.s&&r.s.length)||r.n)) c+=" note";
    var sx=M.cats.sex&&r.x&&r.x.length;if(sx) lab.push("sexual activity logged");
    if(n===T){c+=" today";lab.push("today")}
    if(n===sel) c+=" sel";
    h+='<button class="'+c+'" type="button" id="d-'+n+'" data-day="'+n+'" aria-label="'+esc(lab.join(", "))+'"'+(n===sel?' aria-current="date"':'')+'>'+new Date(n*DAY).getUTCDate()+(sx?'<i class="sx" aria-hidden="true">♥</i>':'')+'</button>';
  }
  h+='</div><div class="legend">'+(M.cats.period?'<span><i class="sw p"></i>Logged period</span>':'')+'<span><i class="sw pr"></i>Predicted</span><span><i class="sw f"></i>Fertile window</span><span><i class="sw o"></i>Ovulation</span>'+(M.cats.sex?'<span><i class="sxl" aria-hidden="true">♥</i>Sexual activity</span>':'')+'</div>';
  return h;
}

function friendly(e){

  if(/already registered|already been registered/i.test(m)) return "That email already has an account. Sign in instead.";
  if(/password should be at least/i.test(m)) return "Use a password of at least 6 characters.";
  if(/email rate limit|over_email_send_rate_limit/i.test(m+c)) return "Too many emails sent from this app this hour. Try again later.";
  if(/signups? not allowed|signup is disabled/i.test(m)) return "New sign-ups are closed. Ask the app's owner to open them.";
  if(/rate limit|too many/i.test(m)) return "Too many attempts. Wait a few minutes and try again.";

function cleanPayload(p){

  var sm=p.summary;
  if(o.cats.pred&&sm&&isDate.test(sm.lastStart)&&isDate.test(sm.lastEnd)) o.summary={lastStart:sm.lastStart,lastEnd:sm.lastEnd,avg:clampInt(sm.avg,15,60,28),pavg:clampInt(sm.pavg,1,12,5)};
  if(p.days&&typeof p.days==="object") Object.keys(p.days).forEach(function(k){
    var r=p.days[k];if(!isDate.test(k)||!r||typeof r!=="object") return;
    var d={},f=clampInt(r.f,0,4,0);if(f&&o.cats.period) d.f=f;
    if(o.cats.sym&&Array.isArray(r.s)) d.s=r.s.slice(0,30).map(function(x){return String(x).slice(0,40)});
    if(o.cats.sym&&r.n) d.n=String(r.n).slice(0,2000);
    if(o.cats.sex&&Array.isArray(r.x)) d.x=r.x.slice(0,10).map(function(x){return String(x).slice(0,40)});
    o.days[k]=d;
  });

}

function buildPayload(){

  if(c.pred&&A.last) p.summary={lastStart:key(A.last.start),lastEnd:key(A.last.end),avg:A.avg,pavg:A.pavg};
  if(c.period||c.sym||c.sex){

      if(num(k)<T-400) return;

  note("Joining…");
  try{
    var r=await P.sb.rpc("redeem_invite",{invite_code:code});if(r.error) throw r.error;
    var inp=$("p-code");if(inp) inp.value="";
    await refreshPartners();
    P.view=r.data;resetCal();go("today");toast("You're connected.");
  }catch(e){note(friendly(e),true)}
}

/* ---------- menu ---------- */
function openMenu(){
  var s=$("menu");
  s.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="Menu">'+
    '<button class="rowlink" type="button" id="m-log"><span><b>Log today</b><small>Bleeding, symptoms, feelings</small></span><span class="chev">›</span></button>'+
    (cfgOK()?'<button class="rowlink" type="button" data-go="sharing"><span><b>Partner sharing</b><small>Invite or join with a code</small></span><span class="chev">›</span></button>':'')+
    '<button class="rowlink" type="button" data-go="settings"><span><b>Backup and data</b><small>Download, restore, delete</small></span><span class="chev">›</span></button>'+
    '<button class="rowlink" type="button" id="m-about"><span><b>About predictions</b><small>How the estimates work</small></span><span class="chev">›</span></button>'+
    '<button class="btn block" type="button" id="m-close" style="margin-top:8px">Close</button></div>';
  s.hidden=false;$("m-close").focus();
}
function closeMenu(){var s=$("menu");if(!s.hidden){s.hidden=true;var b=$("menu-open");if(b) b.focus()}}

/* ---------- events ---------- */
document.addEventListener("click",async function(e){
  if(e.target.id==="menu"){closeMenu();return}
  var t=e.target.closest("button");if(!t) return;
  if(t.closest("#menu")&&t.id!=="m-close") closeMenu();
  if(t.id==="m-close"){closeMenu();return}
  if(t.id==="menu-open"){openMenu();return}
  if(t.dataset.go){if(route==="log"&&logDirty()&&!window.confirm("Discard this entry?")) return;go(t.dataset.go);return}
  if(t.id==="m-log"){openLog(T,"today");return}
  if(t.id==="m-about"){go("insights");setTimeout(function(){var a=$("about-predictions");if(a) a.scrollIntoView({behavior:calm?"auto":"smooth"})},60);return}
  if(t.dataset.pet){
    var w=t.dataset.pet;meow(w);burst(t,"♥","#E39A55");
    if(route==="signin"){var sy=$("say-"+w);quipI[w]=(quipI[w]+1)%CATS[w].hello.length;if(sy) sy.textContent=CATS[w].hello[quipI[w]];return}
    if(route==="setup") return;
    quipI[w]=(quipI[w]+1)%CATS[w].quips.length;saying={who:w,text:CATS[w].quips[quipI[w]]};
    var b=$("bubble");if(b) b.innerHTML=esc(saying.text)+'<small>'+esc(CATS[w].name)+'</small>';
    return;
  }
  if(t.dataset.ctx!==undefined){P.view=t.dataset.ctx||null;resetCal();saying={who:null,text:""};renderPage(false);return}
  if(t.dataset.view){P.view=t.dataset.view;resetCal();go("today");return}
  // setup
  if(t.id==="su-unsure"){SETUP.unsure=!SETUP.unsure;SETUP.date=$("su-date").value;SETUP.cycle=SETUP.unsure?"28":"";SETUP.period=$("su-period").value;renderPage(false);return}
  if(t.id==="su-skip"){data.setupDone=true;queueSave();go("today");return}
  if(t.id==="su-back"){SETUP.step=1;renderPage(true);return}
  if(t.id==="su-start"){
    var s=Math.min(num(SETUP.date),T);
    data.settings={cycle:clampInt(SETUP.cycle,15,60,28),period:clampInt(SETUP.period,1,12,5)};
    for(var d=s;d<s+data.settings.period&&d<=T;d++){var rr=dayRec(d);if(!rr.f||rr.f<2)rr.f=3;data.days[key(d)]={f:rr.f,s:rr.s,x:rr.x,n:rr.n}}
    data.setupDone=true;queueSave();SETUP.step=1;burst(t,"●","var(--period)");go("today");toast("You're all set. Billu has noted it.");return;
  }
  if(t.id==="go-setup"){SETUP={step:1,date:null,cycle:String(data.settings.cycle),period:String(data.settings.period),unsure:false};go("setup");return}
  // today
  if(t.id==="log-today"){openLog(T,"today");return}
  if(t.id==="period-today"){var tr=dayRec(T);tr.f=Math.max(3,tr.f||0);putDay(T,tr);burst(t,"●","var(--period)");renderPage(false);toast("Period logged for today.");return}
  // calendar
  if(t.dataset.day){CAL.sel=+t.dataset.day;var dd=new Date(CAL.sel*DAY);CAL.vy=dd.getUTCFullYear();CAL.vm=dd.getUTCMonth();popId=t.id;renderPage(false);return}
  if(t.id==="cal-prev"||t.id==="cal-next"){var m=CAL.vm+(t.id==="cal-next"?1:-1);CAL.vy+=Math.floor(m/12);CAL.vm=(m%12+12)%12;renderPage(false);return}
  if(t.id==="cal-add"){openLog(CAL.sel,"calendar");return}
  // log
  if(route==="log"&&LOG){
    var on=t.getAttribute("aria-pressed")==="false",r=LOG.draft;
    if(t.dataset.flow!==undefined){r.f=+t.dataset.flow;if(on&&r.f>0)burst(t,"●","var(--period)");popId=t.id;saveNote();renderPage(false);return}
    if(t.dataset.sym){var i=r.s.indexOf(t.dataset.sym);if(i>=0)r.s.splice(i,1);else{r.s.push(t.dataset.sym);burst(t,"✦","var(--ovu)")}popId=t.id;saveNote();renderPage(false);return}
    if(t.dataset.sex){var j=r.x.indexOf(t.dataset.sex);if(j>=0)r.x.splice(j,1);else{r.x.push(t.dataset.sex);burst(t,"♥","var(--heart)")}popId=t.id;LOG.open=true;saveNote();renderPage(false);return}
    if(t.id==="log-back"||t.id==="log-cancel"){if(logDirty()&&!window.confirm("Discard this entry?")) return;var back=LOG.from;LOG=null;go(back);return}
    if(t.id==="log-clear"){if(!window.confirm("Clear everything logged for "+longDate(LOG.n)+"?")) return;putDay(LOG.n,{f:0,s:[],x:[],n:""});var bk=LOG.from;LOG=null;go(bk);toast("Day cleared.");return}
  }
  // settings
  if(t.id==="set-cycle-open"){SETTINGS_OPEN=!SETTINGS_OPEN;renderPage(false);return}
  if(t.id==="dl-backup"){download("berry-blast-backup-"+key(T)+".json",JSON.stringify({app:"berry-blast",tag:"anandamide.ks",exported:key(T),days:data.days,settings:data.settings,sound:data.sound},null,1),"application/json");toast("Backup downloaded.");return}
  if(t.id==="dl-csv"){download("berry-blast-"+key(T)+".csv",csv(),"text/csv");toast("Spreadsheet downloaded.");return}
  if(t.id==="delete-all"){if(!window.confirm("Delete every entry on this device? Download a backup first if you might want it back.")) return;data.days={};queueSave();renderPage(false);toast("All entries deleted.");return}
  // partner sharing
  if(!P.sb) return;
  if(t.dataset.prm){
    if(!window.confirm("Remove this person? They'll lose access to your cycle straight away.")) return;
    var rm=await P.sb.from("partners").delete().eq("owner_id",uid()).eq("partner_id",t.dataset.prm);
    if(rm.error) note(friendly(rm.error),true); else toast("Removed.");refreshPartners();return;
  }
  if(t.dataset.pleave){
    if(!window.confirm("Stop seeing this person's cycle? You'd need a new invite code to see it again.")) return;
    var lv=await P.sb.from("partners").delete().eq("owner_id",t.dataset.pleave).eq("partner_id",uid());
    if(lv.error) note(friendly(lv.error),true); else toast("Done.");
    if(P.view===t.dataset.pleave) P.view=null;refreshPartners();return;
  }
  if(t.id==="p-signup"){
    var em=($("p-email")||{}).value,pw=($("p-pass")||{}).value;
    if(!em||!pw){note("Enter an email and a password first.",true);return}
    if(pw.length<6){note("Use a password of at least 6 characters.",true);return}
    note("Creating your account…");
    var su=await P.sb.auth.signUp({email:em.trim(),password:pw,options:{emailRedirectTo:siteUrl()}});
    if(su.error) note(friendly(su.error),true);
    else if(!su.data.session) note("Check your email and open the confirmation link, then come back here and sign in.");
    else note("Account created.");
    return;
  }
  if(t.id==="p-forgot"){
    var em2=($("p-email")||{}).value;if(!em2){note("Type your email above first.",true);return}
    var fr=await P.sb.auth.resetPasswordForEmail(em2.trim(),{redirectTo:siteUrl()});
    note(fr.error?friendly(fr.error):"If that email has an account, a reset link is on its way.",!!fr.error);return;
  }
  if(t.id==="p-signout"){await P.sb.auth.signOut();toast("Signed out.");return}
  if(t.id==="p-invite"){makeInvite();return}
  if(t.id==="p-copy"&&P.invite){
    var txt=P.invite.code.slice(0,4)+"-"+P.invite.code.slice(4);
    try{await navigator.clipboard.writeText(txt);toast("Code copied.")}
    catch(err){var range=document.createRange();range.selectNodeContents($("p-codeshow"));var sl=getSelection();sl.removeAllRanges();sl.addRange(range);note("Select and copy the code.")}
    return;
  }
});
function saveNote(){var n=$("note");if(n&&LOG) LOG.draft.n=n.value;var m=$("more");if(m&&LOG) LOG.open=m.open}
document.addEventListener("toggle",function(e){if(e.target.id==="more"&&LOG) LOG.open=e.target.open},true);
document.addEventListener("input",function(e){if(e.target.id==="note"&&LOG) LOG.draft.n=e.target.value});
document.addEventListener("submit",async function(e){
  e.preventDefault();
  var id=e.target.id;
  if(id==="setup1"){
    var v=$("su-date").value;if(!v||num(v)>T){toast("Pick a date up to today.");return}
    SETUP.date=v;SETUP.cycle=$("su-cycle").value;SETUP.period=$("su-period").value;SETUP.step=2;renderPage(true);return;
  }
  if(id==="logform"&&LOG){
    saveNote();var d=LOG.draft;d.n=d.n.trim();
    var wasEmpty=isEmpty(dayRec(LOG.n));putDay(LOG.n,d);var back=LOG.from,n=LOG.n;LOG=null;
    if(back==="calendar"){CAL.sel=n}
    go(back);toast(isEmpty(d)?(wasEmpty?"Nothing to save.":"Day cleared."):"Saved. Billu has noted it.");return;
  }
  if(!P.sb) return;
  if(id==="p-auth"){
    note("Signing in…");
    var r=await P.sb.auth.signInWithPassword({email:$("p-email").value.trim(),password:$("p-pass").value});
    note(r.error?friendly(r.error):"",!!r.error);
  }else if(id==="p-join"){joinCode($("p-code").value)}
  else if(id==="p-recover"){
    var u=await P.sb.auth.updateUser({password:$("p-newpass").value});
    if(u.error) note(friendly(u.error),true); else {P.recovery=false;toast("Password updated.");go("sharing")}
  }
});
document.addEventListener("change",function(e){
  var id=e.target.id;
  if(id==="restore-file"){if(e.target.files&&e.target.files[0]) restore(e.target.files[0]);e.target.value="";return}
  if(id==="set-sound"){data.sound=e.target.checked;queueSave();if(data.sound) meow("billu");return}
  if(id==="set-cycle"||id==="set-period"){
    data.settings={cycle:clampInt($("set-cycle").value,15,60,28),period:clampInt($("set-period").value,1,12,5)};queueSave();renderPage(false);return;
  }
  if(id==="p-on"){data.share.on=e.target.checked;P.pushedAt=0;queueSave();pushShare();if(!data.share.on)P.invite=null;renderPage(false);return}
  if(e.target.dataset&&e.target.dataset.cat){data.share.cats[e.target.dataset.cat]=e.target.checked;P.pushedAt=0;queueSave();renderPage(false);return}
  if(id==="p-name"){data.share.name=e.target.value.trim().slice(0,40);queueSave();return}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape") closeMenu();
  if((e.key==="Enter"||e.key===" ")&&e.target.id==="restore-lbl"){e.preventDefault();$("restore-file").click()}
});
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState!=="visible") return;
  var t=todayN();if(t!==T){T=t;if(route!=="log") renderPage(false)}
  if(uid()) refreshPartners();
});
window.addEventListener("online",function(){if(uid()){queuePush();refreshPartners()}});
window.addEventListener("hashchange",show);
window.addEventListener("pagehide",function(){if(dirty){clearTimeout(timer);flush()}});

/* ---------- boot ---------- */
try{adopt(JSON.parse(localStorage.getItem(LS)||"null"))}catch(e){}
if(Object.keys(data.days).length) data.setupDone=true;
resetCal();
show();
ready=true;
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&location.protocol!=="file:"){navigator.serviceWorker.register("sw.js").catch(function(){})}
initPartner();
})();
</script>
</body>
